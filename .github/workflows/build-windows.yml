
name: Build StockMalin Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name StockMalin app.py
      - uses: actions/upload-artifact@v4
        with:
          name: StockMalin-Windows
          path: dist/StockMalin.exe
  
